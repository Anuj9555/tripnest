services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=TripNest API
      - SECRET_KEY=tripnest-secure-secret-key-production
      - DATABASE_URL=sqlite:///./tripnest.db
      - AI_API_KEY=
      - AI_MODEL=gemini-1.5-flash
    volumes:
      - ./backend/tripnest.db:/app/tripnest.db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      - backend
